[package]
name = "dol-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL — foundation crate: source spans, structured diagnostics, and the DOL value/type system."
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/geniustechspace/dol"
keywords = ["dol", "database", "schema", "types", "no-std"]
categories = ["database", "data-structures", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
smallvec = { workspace = true }
serde = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
hashbrown = { workspace = true }

[features]
# ── Cargo features ───────────────────────────────────────────────────────────
#
# v2 (0.2.0) shape: `no_std + alloc` is the default. Every capability beyond
# the universal type vocabulary is an opt-in feature, mirroring the
# workspace-wide invariant declared in `Cargo.toml`. Embedded users get the
# minimal shape for free; server users opt into `std`, `serde`, and the
# typesystem-variant families they need.
#
# | feature    | effect                                                                                                     |
# | ---------- | ---------------------------------------------------------------------------------------------------------- |
# | `std`      | Wall-clock factory helpers (`datetime::today/now/now_tz`); implies `datetime`. Adds nothing else by itself.|
# | `serde`    | `Serialize` / `Deserialize` for every type that implements them. (Pre-v2 was default-on.)                  |
# | `geo`      | `geo` module + `Value`/`Literal`/`DataType`/`TypeError` variants for geometric types.                      |
# | `network`  | `network` module + `Inet` / `MacAddr` variants on `Value` / `Literal` / `DataType`.                        |
# | `datetime` | `datetime` module + `Date` / `Time` / `DateTime` / `TimestampTz` / `Interval` variants.                    |
# | `numeric`  | `numeric` module + `Decimal` variants and decimal-related `TypeError` arms.                                |
#
# `core::error::Error` impls on `TypeError` and `ParseMacAddrError` are
# always available regardless of features (stable since Rust 1.81).
default = ["hash"]
serde = ["dep:serde", "smallvec/serde"]
std = ["datetime"]
geo = []
network = []
datetime = []
numeric = []
# `hash` enables the `dol_core::hash` chokepoint module — the only place
# in the workspace allowed to call `blake3` directly. Off by default to
# preserve the minimal `no_std + alloc` shape; opt-in for crates that
# need content-hashing (`dol-wire`, future `Signed<T>` envelopes).
hash = ["dep:blake3"]
# `defmt` opts the embedded-friendly `defmt::Format` impls in on
# `ErrorCode` and `Span`. Replaces `core::fmt::Display` for ~10× smaller
# log code on Cortex-M (per `docs/v2_plan.md` §32). Off by default —
# only embedded users (RTIC, Embassy, …) opt in.
defmt = ["dep:defmt"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1"

[lints]
workspace = true
