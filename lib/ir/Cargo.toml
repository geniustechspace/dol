[package]
name = "dol-ir"
version.workspace = true
edition.workspace = true
publish = false
description = "DOL IR — universal Operation enum, capability layer, and Backend trait"
readme = "README.md"

[dependencies]
# Hand-rolled (not `workspace = true`) so we can opt out of `dol-core`'s and
# `dol-schema`'s default features and stay `no_std + alloc`-clean. The paths
# mirror the workspace deps.
dol-expr   = { path = "../expr",   default-features = false }
dol-schema = { path = "../schema", default-features = false }
dol-core   = { path = "../core",   default-features = false }
smallvec   = { workspace = true }
serde      = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# `default = []` keeps the crate `no_std + alloc`-clean for embedded
# consumers. Enable `std` to get `std::error::Error` impls and any future
# std-dependent helpers.
default = []
std = ["dol-core/std", "dol-expr/std"]
serde = ["dep:serde", "dol-expr/serde", "dol-schema/serde", "dol-core/serde", "smallvec/serde"]
raw = []
