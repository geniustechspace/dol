[package]
name = "dol-expr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL expression AST, type system, arena, and interner (internal)"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/geniustechspace/dol"
keywords = ["dol", "database", "ast", "query", "no-std"]
categories = ["database", "data-structures", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Hand-rolled (not `workspace = true`) so we can opt out of `dol-core`'s
# default features and stay `no_std + alloc`-clean. The path mirrors the
# workspace dep.
dol-core  = { path = "../core", default-features = false }
hashbrown = { workspace = true }
smallvec  = { workspace = true }
serde     = { workspace = true, optional = true }

[features]
# `default = []` keeps the crate `no_std + alloc`-clean for embedded
# consumers. Enable `std` to get `core::error::Error` impls (where added
# upstream) and any future std-dependent helpers.
default = []
std = ["dol-core/std"]
serde = ["dep:serde", "dol-core/serde", "smallvec/serde"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "expr"
harness = false
required-features = ["serde"]
