[package]
name = "dol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL — umbrella facade re-exporting the dol-* crates behind feature flags."
readme = "README.md"

[dependencies]
# Always-on foundation.
dol-core = { workspace = true }

# Optional layers
dol-expr     = { workspace = true, optional = true }
dol-schema   = { workspace = true, optional = true }
dol-ir       = { workspace = true, optional = true }
dol-pipeline = { workspace = true, optional = true }
dol-stream   = { workspace = true, optional = true }
dol-wire     = { workspace = true, optional = true }
dol-check    = { workspace = true, optional = true }
dol-fmt      = { workspace = true, optional = true }
dol-query    = { workspace = true, optional = true }

[features]
default = []

# Forwards `std` to every active sub-crate so umbrella consumers can opt
# into the `std::error::Error` impls (and any other std-gated surface)
# uniformly. Disable for `no_std + alloc` targets — every dol-* crate
# below is `no_std + alloc`-clean.
std = [
    "dol-core/std",
    "dol-expr?/std",
    "dol-schema?/std",
    "dol-ir?/std",
    "dol-pipeline?/std",
    "dol-stream?/std",
    "dol-wire?/std",
    "dol-query?/std",
]

# ── Individual layers ────────────────────────────────────────────────────────
expr     = ["dep:dol-expr"]
schema   = ["dep:dol-schema", "expr"]
ir       = ["dep:dol-ir", "expr", "schema"]
pipeline = ["dep:dol-pipeline", "ir"]
stream   = ["dep:dol-stream", "ir"]
wire     = ["dep:dol-wire", "ir"]
check    = ["dep:dol-check", "ir"]
fmt      = ["dep:dol-fmt", "ir"]
query    = ["dep:dol-query", "ir"]

# ── Granular dol-core features (default-on in dol-core itself) ───────────────
# These pass-throughs let umbrella consumers add or omit dol-core variant
# families when they pin `dol-core` with `default-features = false`.
geo      = ["dol-core/geo"]
network  = ["dol-core/network"]
datetime = ["dol-core/datetime"]
numeric  = ["dol-core/numeric"]

# ── Curated presets ──────────────────────────────────────────────────────────

# Just the language: types + expr + schema + IR + builders. No streaming,
# no codecs, no diagnostics renderer. Smallest sensible "full programs" build.
core     = ["expr", "schema", "ir", "query"]

# Everything DOL ships today.
full     = [
    "expr", "schema", "ir",
    "pipeline", "stream",
    "wire", "check", "fmt",
    "query",
    "geo", "network", "datetime", "numeric",
]

# Minimal IoT-edge slice: types, IR, streaming verbs, postcard wire. No
# diagnostics renderer, no JSON codec, no pretty-printer. Designed to fit
# inside a `thumbv7em` binary budget. Keeps `numeric` + `datetime` (sensors
# typically report `Decimal` readings with timestamps) but drops `geo` +
# `network` to actively exercise the granular dol-core gates.
iot-min  = [
    "expr", "schema", "ir",
    "stream",
    "wire",
    "dol-wire/postcard",
    "dol-wire/serde",
    "numeric", "datetime",
]

# Universal serde — turns on `serde` everywhere it's available.
serde    = [
    "dol-core/serde",
    "dol-expr?/serde",
    "dol-schema?/serde",
    "dol-ir?/serde",
    "dol-pipeline?/serde",
    "dol-stream?/serde",
    "dol-wire?/serde",
    "dol-check?/serde",
    "dol-query?/serde",
]

[lints]
workspace = true
