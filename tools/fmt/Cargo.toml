[package]
name = "dol-fmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL — canonical pretty-printer for IR programs."
readme = "README.md"

[dependencies]
dol-command     = { workspace = true }
dol-schema = { workspace = true }
dol-core   = { workspace = true }
dol-expr   = { workspace = true }

[features]
default = []
serde   = [
    "dol-command/serde",
    "dol-schema/serde",
    "dol-core/serde",
    "dol-expr/serde",
]

[lints]
workspace = true
