name: CI

# M0 scaffold per `dol-rewrite-plan-v2.md` §5.3. Heavy jobs from the
# pre-v2 pipeline that exercised the now-on-disk-only `lib/expr`,
# `lib/schema`, `lib/command`, `lib/stream`, `lib/pipeline` crates have
# been removed; they will be reintroduced layer by layer as those crates
# land in their v2 shape under `lib/dol-cas`, `lib/dol-ir`, etc.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - name: Cargo check workspace
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Run tests (all features)
        run: cargo test --workspace --all-features
      - name: Doctests + rustdoc lints
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
        run: |
          cargo test --doc --workspace --all-features
          cargo doc --workspace --all-features --no-deps

      # v2 invariant gate (per `dol-rewrite-plan-v2.md` §12.5): every
      # public recursive entry point in `lib/` must thread `&mut Budget`.
      # Each opt-out is explicit prose attached to the offending site.
      - name: Budget-gate (recursive entry points)
        run: cargo run -p xtask -- budget-gate

  xtask:
    # Per `dol-rewrite-plan-v2.md` §5.3, the four other xtask subcommands
    # are stubs during M0 and gain real implementations as the gated
    # crates land.
    name: xtask Gates (size-check / dag-check / no-std-check / size-report)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
      - name: xtask size-check
        run: cargo run -q -p xtask -- size-check
      - name: xtask dag-check
        run: cargo run -q -p xtask -- dag-check
      - name: xtask no-std-check
        run: cargo run -q -p xtask -- no-std-check
      - name: xtask size-report
        run: cargo run -q -p xtask -- size-report

  no-std:
    # Per `dol-rewrite-plan-v2.md` §5.3: M0 builds `dol-core`, `dol-cas`,
    # and `dol-ir` for the IoT bare-metal target. The umbrella `iot-min`
    # preset graduates here in M6.
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: no-std
      - name: Cargo check dol-core (no_std, no default features)
        run: cargo check -p dol-core --target thumbv7em-none-eabihf --no-default-features
      - name: Cargo check dol-cas (no_std)
        run: cargo check -p dol-cas --target thumbv7em-none-eabihf --no-default-features
      - name: Cargo check dol-ir (no_std)
        run: cargo check -p dol-ir --target thumbv7em-none-eabihf --no-default-features

  msrv:
    name: MSRV (cargo check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV is $msrv"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: Cargo check workspace at MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-features

  deny:
    name: Cargo Deny (Security Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny check
