[package]
name = "dol-core"
version.workspace = true
edition.workspace = true
publish = false
description = "DOL Core — the complete language layer (expressions, models, IR, builders, Backend trait)."

[dependencies]
dol-expr = { path = "crates/expr" }
dol-entity = { path = "crates/entity" }
dol-ir = { path = "crates/ir" }
dol-builder = { path = "crates/builder" }

[features]
default = []
serde = ["dol-expr/serde", "dol-entity/serde", "dol-ir/serde"]
