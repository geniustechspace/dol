[package]
name = "dol-ir"
version.workspace = true
edition.workspace = true
publish = false
description = "DOL intermediate representation — backend-agnostic AST and Backend trait."

[dependencies]
dol-expr = { path = "../dol-expr" }
dol-model = { path = "../dol-model" }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "dol-expr/serde", "dol-model/serde"]
