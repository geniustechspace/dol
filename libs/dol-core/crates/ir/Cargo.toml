[package]
name = "dol-ir"
version.workspace = true
edition.workspace = true
publish = false
description = "DOL intermediate representation — backend-agnostic AST and Backend trait."

[dependencies]
dol-expr = { path = "../expr" }
dol-entity = { path = "../entity" }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "dol-expr/serde", "dol-entity/serde"]
