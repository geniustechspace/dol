# DOL Simple Configuration Example (TOML)
#
# Minimal configuration for development and simple deployments.
# Only configure the backends you actually use.
#
# Usage in Rust:
#   use dol::DolConfig;
#   let cfg = DolConfig::from_file("dol.toml").unwrap();

# ===========================================================================
# SQL Backend (single instance, SQLite for development)
# ===========================================================================
[sql]
dialect = "sqlite"

[sql.primary]
url = "sqlite://data/app.db"

[sql.primary.pool]
max_connections = 5

[sql.migrations]
auto_run = true

# ===========================================================================
# Key-Value Backend (optional — uncomment if needed)
# ===========================================================================
# [kv]
# provider = "Redis"
# key_prefix = "app:"
# default_ttl_secs = 3600
#
# [kv.primary]
# url = "redis://localhost:6379"

# ===========================================================================
# Object Storage Backend (optional — uncomment if needed)
# ===========================================================================
# [storage]
# provider = "Local"
#
# [storage.primary]
# bucket = "local-data"
#
# [storage.local]
# base_path = "./data/storage"
