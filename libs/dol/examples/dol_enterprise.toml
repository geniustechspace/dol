# DOL Unified Configuration Example (TOML)
#
# This file demonstrates a complete, enterprise-grade DOL configuration
# with all three backends (SQL, Key-Value, Object Storage), each supporting
# multiple instances, replicas, TLS, and provider-specific settings.
# It also shows the unified migration configuration that controls
# migrations across all backends from a single section.
#
# Usage in Rust:
#   use dol::DolConfig;
#   let cfg = DolConfig::from_file("dol.toml").unwrap();
#   // or
#   let cfg: DolConfig = toml::from_str(include_str!("dol.toml")).unwrap();

# ===========================================================================
# Unified Migration Settings (applies to ALL backends)
# ===========================================================================
[migrations]
# Run pending migrations automatically on application startup.
auto_run = true
# Name of the table used to track applied migrations (SQL backend).
table_name = "_dol_migrations"
# Locking strategy: "none", "advisory_lock", "lock_table"
lock_strategy = "advisory_lock"
# Validate checksums of applied migrations before running new ones.
validate_checksums = true
# Abort on the first migration error (recommended for production).
abort_on_error = true
# Dry-run mode: plan and render but do not execute.
dry_run = false

# Which backends should receive migration steps.
# Disable backends you don't use to skip irrelevant migration rendering.
[migrations.backends]
sql = true
kv = true
storage = true

# ===========================================================================
# SQL Backend
# ===========================================================================
[sql]
# Dialect: "postgresql", "mysql", "mariadb", "sqlite", "mssql", "oracle",
#          "cockroachdb" — or provide an inline dialect table.
dialect = "postgresql"

# --- Primary (read-write) instance ---
[sql.primary]
url = "postgres://idp:secret@primary.db.internal:5432/idp_prod"

[sql.primary.pool]
max_connections = 20
min_connections = 5
acquire_timeout_secs = 30
idle_timeout_secs = 600
max_lifetime_secs = 1800

[sql.primary.tls]
enabled = true
ca_cert_path = "/etc/ssl/certs/rds-combined-ca-bundle.pem"

# --- Read replicas ---
[[sql.replicas]]
name = "replica-us-east"
url = "postgres://idp:secret@replica-east.db.internal:5432/idp_prod"

[sql.replicas.pool]
max_connections = 30

[[sql.replicas]]
name = "replica-eu-west"
url = "postgres://idp:secret@replica-eu.db.internal:5432/idp_prod"

# --- Named instances for special workloads ---
[sql.instances.analytics]
url = "postgres://analytics:secret@analytics.db.internal:5432/idp_analytics"

[sql.instances.analytics.pool]
max_connections = 50
min_connections = 2

# --- Migrations ---
[sql.migrations]
auto_run = true
directory = "db/migrations"

# --- Query logging ---
[sql.logging]
log_queries = false
log_slow_queries = true
slow_query_threshold_ms = 100

# ===========================================================================
# Key-Value Backend
# ===========================================================================
[kv]
# Provider: "Redis", "Etcd", "DynamoDB", "Memcached"
provider = "Redis"
key_prefix = "idp:"
default_ttl_secs = 3600

# --- Primary instance ---
[kv.primary]
url = "redis://redis-primary.internal:6379"

[kv.primary.pool]
max_connections = 20

[kv.primary.tls]
enabled = true

# --- Read replicas ---
[[kv.replicas]]
name = "redis-replica-1"
url = "redis://redis-replica-1.internal:6379"

# --- Named instances ---
[kv.instances.sessions]
url = "redis://sessions.internal:6379"

[kv.instances.sessions.pool]
max_connections = 50

[kv.instances.rate_limits]
url = "redis://rate-limits.internal:6379"

# --- Redis-specific settings ---
[kv.redis]
database = 0
cluster = false

# Optional Sentinel failover:
# [kv.redis.sentinel]
# master_name = "mymaster"
# nodes = ["redis://sentinel-1:26379", "redis://sentinel-2:26379", "redis://sentinel-3:26379"]

# ===========================================================================
# Object Storage Backend
# ===========================================================================
[storage]
# Provider: "S3", "Gcs", "AzureBlob", "Local"
provider = "S3"

# --- Primary instance ---
[storage.primary]
bucket = "idp-assets"
region = "us-east-1"
# endpoint = "http://localhost:9000"  # For MinIO / LocalStack
# force_path_style = true             # Required for most S3-compatible stores

# --- Replicas for geo-redundancy ---
[[storage.replicas]]
name = "eu-replica"
bucket = "idp-assets-eu"
region = "eu-west-1"

# --- Named instances ---
[storage.instances.backups]
bucket = "idp-backups"
region = "us-west-2"

[storage.instances.uploads]
bucket = "idp-uploads"
region = "us-east-1"

# --- S3-specific settings ---
[storage.s3]
# Credentials are typically set via environment variables:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Or provide them here:
# access_key_id = "AKIA..."
# secret_access_key = "..."
storage_class = "INTELLIGENT_TIERING"
server_side_encryption = "aws:kms"
kms_key_id = "arn:aws:kms:us-east-1:123456789:key/abc-123"
