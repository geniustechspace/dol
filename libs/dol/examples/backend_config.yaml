# DOL Unified Configuration Example (YAML)
#
# This file demonstrates how to configure all DOL backends in YAML format.
# DOL is storage-agnostic — the same model definitions work across SQL
# databases, key-value stores, and object storage.
#
# Usage in Rust:
#   use dol::DolConfig;
#   let cfg = DolConfig::from_yaml_str(include_str!("backend_config.yaml")).unwrap();

# ===========================================================================
# SQL Backend
# ===========================================================================
sql:
  # Built-in presets: postgresql, mysql, mariadb, sqlite, mssql, oracle, cockroachdb
  dialect: postgresql

  # Primary (read-write) instance
  primary:
    url: "postgres://user:pass@primary:5432/mydb"
    pool:
      max_connections: 20
      min_connections: 5
      acquire_timeout_secs: 30
      idle_timeout_secs: 600
      max_lifetime_secs: 1800
    tls:
      enabled: true
      ca_cert_path: "/etc/ssl/certs/rds-ca.pem"

  # Read replicas
  replicas:
    - name: replica-east
      url: "postgres://user:pass@replica-east:5432/mydb"
      pool:
        max_connections: 30
    - name: replica-west
      url: "postgres://user:pass@replica-west:5432/mydb"

  # Named instances for special workloads
  instances:
    analytics:
      url: "postgres://analytics:pass@analytics-host/analytics_db"
      pool:
        max_connections: 50

  migrations:
    auto_run: true
    directory: migrations

  logging:
    log_queries: false
    log_slow_queries: true
    slow_query_threshold_ms: 100

# ===========================================================================
# Key-Value Backend
# ===========================================================================
kv:
  # Provider options: Redis, Etcd, DynamoDB, Memcached
  provider: Redis
  key_prefix: "app:"
  default_ttl_secs: 3600

  primary:
    url: "redis://localhost:6379"
    pool:
      max_connections: 10

  replicas:
    - name: redis-replica-1
      url: "redis://replica-1:6379"

  instances:
    sessions:
      url: "redis://sessions-host:6379"
      pool:
        max_connections: 50

  redis:
    database: 0
    cluster: false
    # sentinel:
    #   master_name: mymaster
    #   nodes:
    #     - "redis://sentinel-1:26379"
    #     - "redis://sentinel-2:26379"

# ===========================================================================
# Object Storage Backend
# ===========================================================================
storage:
  # Provider options: S3, Gcs, AzureBlob, Local
  provider: S3

  primary:
    bucket: my-app-assets
    region: us-east-1
    # endpoint: "http://localhost:9000"  # For MinIO or local S3-compatible stores
    # force_path_style: true

  replicas:
    - name: eu-replica
      bucket: my-app-assets-eu
      region: eu-west-1

  instances:
    backups:
      bucket: my-app-backups
      region: us-west-2

  s3:
    storage_class: STANDARD
    # Credentials via environment: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
