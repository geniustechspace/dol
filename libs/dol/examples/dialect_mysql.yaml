# MySQL 8+ dialect configuration for DOL
#
# Usage in Rust:
#   let dialect = Dialect::from_yaml_str(include_str!("dialect_mysql.yaml")).unwrap();
#   let sql = model.get().where_eq("id").render(Some(&dialect)).unwrap();
#
# This configuration matches Dialect::mysql() and can be customized as needed.

name: mysql

# Bind parameter style: ?, ?, ?
param_style:
  style: Positional

# Identifier quoting: `column_name`
quote_style: Backtick

# Pagination: LIMIT n OFFSET m
pagination: LimitOffset

# Upsert: INSERT ... ON DUPLICATE KEY UPDATE
upsert_style: OnDuplicateKey

# MySQL does not support RETURNING
returning_style: Unsupported

# Boolean literals (MySQL uses 1/0)
bool_true: "1"
bool_false: "0"

# String concatenation: CONCAT(a, b)
concat_style: ConcatFunction

# JSON access: json_extract(col, '$.field')
json_access: JsonExtractFunction

# Array literals: JSON_ARRAY(1, 2, 3)
array_literal_style: JsonArrayFunction

# Store kind
store_kind: Sql

# Type mappings (LogicalType → physical SQL type)
type_map:
  mappings:
    Uuid: "CHAR(36)"
    Text: "TEXT"
    Integer: "INT"
    Boolean: "TINYINT(1)"
    Timestamptz: "DATETIME(6)"
    Jsonb: "JSON"
    TextArray: "JSON"
    SmallInt: "SMALLINT"
    BigInt: "BIGINT"
    Real: "FLOAT"
    DoublePrecision: "DOUBLE"
    Numeric: "DECIMAL"
    Bytea: "LONGBLOB"
    Date: "DATE"
    Time: "TIME"
    Interval: "VARCHAR(64)"
    Serial: "INT AUTO_INCREMENT"
    BigSerial: "BIGINT AUTO_INCREMENT"
    Inet: "VARCHAR(45)"

# Row-level locking
locking:
  for_update: true
  for_share: true
  skip_locked: true      # MySQL 8.0+
  nowait: true           # MySQL 8.0+
  use_table_hint: false

# DDL capabilities
ddl:
  create_if_not_exists: true
  drop_if_exists: true
  index_concurrently: false
  enum_style: InlineEnum    # ENUM('a', 'b')
  auto_increment_style: AutoIncrement
  alter_add_column: true
  alter_drop_column: true
  alter_rename_column: true
  alter_modify_column: true
  alter_rename_table: true
  transactional_ddl: false
  drop_cascade: false

# Feature flags
features:
  distinct_on: false
  ilike: false
  array_any: false
  nulls_ordering: false
  anonymous_blocks: false
  schemas: false            # MySQL uses databases, not schemas
  cte: true                 # MySQL 8.0+
  window_functions: true    # MySQL 8.0+
  lateral_join: true
  on_conflict: false
