# PostgreSQL 12+ dialect configuration for DOL
#
# Usage in Rust:
#   let dialect = Dialect::from_toml_str(include_str!("dialect_postgres.toml")).unwrap();
#   let sql = model.get().where_eq("id").render(Some(&dialect)).unwrap();
#
# This configuration matches Dialect::postgres() and can be customized as needed.

name = "postgresql"

# Bind parameter style: $1, $2, $3 ...
[param_style]
style = "Numbered"
prefix = "$"

# Identifier quoting: "column_name"
quote_style = "DoubleQuote"

# Pagination: LIMIT n OFFSET m
pagination = "LimitOffset"

# Upsert: INSERT ... ON CONFLICT
upsert_style = "OnConflict"

# RETURNING clause: RETURNING col1, col2
returning_style = "Returning"

# Boolean literals
bool_true = "TRUE"
bool_false = "FALSE"

# String concatenation: a || b
concat_style = "PipeOperator"

# JSON access: col->>'field'
json_access = "ArrowOperator"

# Array literals: ARRAY[1, 2, 3]
array_literal_style = "ArrayKeyword"

# Store kind (extension point)
store_kind = "Sql"

# --- Type mappings (LogicalType → physical SQL type) ---
[type_map.mappings]
Uuid = "UUID"
Text = "TEXT"
Integer = "INTEGER"
Boolean = "BOOLEAN"
Timestamptz = "TIMESTAMPTZ"
Jsonb = "JSONB"
TextArray = "TEXT[]"
SmallInt = "SMALLINT"
BigInt = "BIGINT"
Real = "REAL"
DoublePrecision = "DOUBLE PRECISION"
Numeric = "NUMERIC"
Bytea = "BYTEA"
Date = "DATE"
Time = "TIME"
Interval = "INTERVAL"
Serial = "SERIAL"
BigSerial = "BIGSERIAL"
Inet = "INET"

# --- Row-level locking ---
[locking]
for_update = true
for_share = true
skip_locked = true
nowait = true
use_table_hint = false

# --- DDL capabilities ---
[ddl]
create_if_not_exists = true
drop_if_exists = true
index_concurrently = true
enum_style = "CreateType"
auto_increment_style = "SerialType"
alter_add_column = true
alter_drop_column = true
alter_rename_column = true
alter_modify_column = true
alter_rename_table = true
transactional_ddl = true
drop_cascade = true

# --- Feature flags ---
[features]
distinct_on = true
ilike = true
array_any = true
nulls_ordering = true
anonymous_blocks = true
schemas = true
cte = true
window_functions = true
lateral_join = true
on_conflict = true
