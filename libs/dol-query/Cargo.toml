[package]
name = "dol-query"
version.workspace = true
edition.workspace = true
publish = false
description = "DOL Query — backend-neutral query entry point for any data source."

[dependencies]
dol-schema = { workspace = true }
dol-expr = { workspace = true }
dol-ir = { workspace = true }
dol-types = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
serde = [
    "dep:serde",
    "dol-schema/serde",
    "dol-ir/serde",
    "dol-types/serde",
    "dol-expr/serde",
]
