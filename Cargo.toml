# ── Workspace ──────────────────────────────────────────────────────────────────
#
# DOL v2 workspace skeleton (per `dol-rewrite-plan-v2.md` §5.1).
#
#   lib/dol-core ──► lib/dol-cas ──► lib/dol-ir ──┬──► lib/dol-wire
#                                                  └──► lib/dol-query
#                                                            │
#                                                            ▼
#                                                          dol (umbrella)
#
# Invariants enforced by the xtask gates:
#   * Nothing in `lib/`  may depend on `tools/` or `backends/`.
#   * `dol-core` has zero workspace dependencies.
#   * `dol-cas`  depends only on `dol-core`.
#   * `dol-ir`   depends only on `dol-cas`, `dol-core`.
#   * `dol-wire` depends only on `dol-ir`, `dol-core`.
#   * `dol-query` depends only on `dol-ir`, `dol-core`.
#   * Backends depend only on `dol-ir` (+ optionally `dol-wire`).
#
# The legacy `lib/expr`, `lib/schema`, `lib/command`, `lib/stream`,
# `lib/pipeline` directories remain on disk as a reference to mine from
# during M1–M5; they are excluded from the workspace below.

[workspace]
resolver = "2"
members = [
    "lib/dol-core",
    "lib/dol-cas",
    "lib/dol-ir",
    "lib/dol-wire",
    "lib/dol-query",
    "dol",
    "tools/check",
    "tools/fmt",
    "xtask",
]
exclude = [
    "lib/expr",
    "lib/schema",
    "lib/command",
    "lib/stream",
    "lib/pipeline",
    "lib/dol-wire/fuzz",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

# ── Workspace-wide lints ─────────────────────────────────────────────────────
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# v2 invariant: zero panic-paths in production code. Tests carry the
# `#![cfg_attr(test, allow(...))]` exemption at every crate root.
unwrap_used             = "deny"
expect_used             = "deny"
panic                   = "deny"
indexing_slicing        = "deny"
arithmetic_side_effects = "deny"

# ── Workspace-wide dependency pins ───────────────────────────────────────────
#
# Pinned per `dol-rewrite-plan-v2.md` §5.1. The plan calls out:
#
#   blake3, xxhash-rust, smallvec, serde, postcard      (runtime / codec)
#   proptest, criterion, insta                          (dev / bench / snapshot)
#
# `hashbrown`, `bytemuck`, `serde_json`, `defmt` were used by legacy crates
# and are kept here so the still-on-disk `lib/{expr,schema,command,…}`
# directories can be revived under a fresh workspace during M1–M3 reads
# without a manifest scramble. Survivors should *not* depend on them.
[workspace.dependencies]
# Hash layer — only dol-core may depend on these directly.
blake3      = { version = "1", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Compact inline vec — only dol-core (Path field chain).
smallvec    = { version = "1", default-features = false }

# Serialisation — only dol-wire may use full serde derive.
serde       = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard    = { version = "1", default-features = false }
serde_json  = "1"

# Legacy pins kept for the on-disk reference crates (M1–M3 source).
hashbrown   = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
bytemuck    = { version = "1", features = ["derive"] }
defmt       = { version = "0.3", default-features = false }

# Testing
proptest    = "1"
criterion   = "0.5"
insta       = "1"

# ── Internal crates (v2) ─────────────────────────────────────────────────────
dol-core    = { path = "lib/dol-core", default-features = false }
dol-cas     = { path = "lib/dol-cas",  default-features = false }
dol-ir      = { path = "lib/dol-ir",   default-features = false }
dol-wire    = { path = "lib/dol-wire" }
dol-query   = { path = "lib/dol-query" }
dol-check   = { path = "tools/check" }
dol-fmt     = { path = "tools/fmt" }
dol         = { path = "dol" }
