# ── Workspace ──────────────────────────────────────────────────────────────────
#
# DOL is structured as a flat workspace with a strict, acyclic dependency DAG.
# Each crate has a single, narrow purpose; see `docs/` (when populated) and the
# top-level README for the full layering rationale.
#
#   dol-arena ─┐
#   dol-span  ─┼─► dol-types ─► dol-expr ─► dol-schema ─► dol-ir ─► dol-pipeline ─► dol-query
#   dol-diag  ─┘                                            │           │
#                                                           ├──► dol-stream
#                                                           ├──► dol-wire
#                                                           ├──► dol-check
#                                                           └──► dol-fmt
#                                                           dol  (umbrella; depends on all, optional)
#
# `dol` (umbrella) is the only crate allowed to depend on `dol-query`, and no
# crate may depend on `dol`. Cycles are intended to be enforced by `cargo deny`.

[workspace]
resolver = "2"
members = [
    # Foundations — pure infrastructure, no DOL semantics
    "crates/dol-arena",
    "crates/dol-span",
    "crates/dol-diag",

    # Type system & values
    "crates/dol-types",

    # Expression algebra
    "crates/dol-expr",

    # Schema language
    "crates/dol-schema",

    # Statement IR + Backend trait + capabilities
    "crates/dol-ir",

    # Dataflow & streaming IR
    "crates/dol-pipeline",
    "crates/dol-stream",

    # Codecs / static checks / pretty printing
    "crates/dol-wire",
    "crates/dol-check",
    "crates/dol-fmt",

    # Builder DSL
    "crates/dol-query",

    # Umbrella facade
    "crates/dol",

    # Dev tooling
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# ── Collections / utility ────────────────────────────────────────────────────
smallvec   = { version = "1", features = ["union", "serde"] }
hashbrown  = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
bytemuck   = { version = "1", features = ["derive"] }

# ── Serialisation ────────────────────────────────────────────────────────────
serde        = { version = "1", features = ["derive", "rc"] }
serde_json   = "1"
postcard     = { version = "1", default-features = false, features = ["alloc"] }

# ── Hashing ──────────────────────────────────────────────────────────────────
blake3       = { version = "1", default-features = false }

# ── Internal crates ──────────────────────────────────────────────────────────
dol-arena    = { path = "crates/dol-arena" }
dol-span     = { path = "crates/dol-span" }
dol-diag     = { path = "crates/dol-diag" }
dol-types    = { path = "crates/dol-types" }
dol-expr     = { path = "crates/dol-expr" }
dol-schema   = { path = "crates/dol-schema" }
dol-ir       = { path = "crates/dol-ir" }
dol-pipeline = { path = "crates/dol-pipeline" }
dol-stream   = { path = "crates/dol-stream" }
dol-wire     = { path = "crates/dol-wire" }
dol-check    = { path = "crates/dol-check" }
dol-fmt      = { path = "crates/dol-fmt" }
dol-query    = { path = "crates/dol-query" }
dol          = { path = "crates/dol" }
