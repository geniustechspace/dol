# ── Workspace ──────────────────────────────────────────────────────────────────

[workspace]
resolver = "2"
members = [
    "libs/dol",
    "libs/dol-core",
    "libs/dol-core/crates/dol-expr",
    "libs/dol-core/crates/dol-model",
    "libs/dol-core/crates/dol-ir",
    "libs/dol-core/crates/dol-builder",
    "libs/dol-sql",
    "libs/dol-kv",
    "libs/dol-objects",
    "libs/dol-migration",
    "libs/dol-config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml_crate = { package = "toml", version = "1" }

# Internal crates
dol-core = { path = "libs/dol-core" }
dol-sql = { path = "libs/dol-sql" }
dol-kv = { path = "libs/dol-kv" }
dol-objects = { path = "libs/dol-objects" }
dol-migration = { path = "libs/dol-migration" }
dol-config = { path = "libs/dol-config" }
