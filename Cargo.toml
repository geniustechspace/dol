# ── Workspace ──────────────────────────────────────────────────────────────────

[workspace]
resolver = "2"
members = [
    "libs/dol",
    "libs/dol-types",
    "libs/dol-core",
    "libs/dol-entity",
    "libs/dol-query",
    "libs/dol-sql",
    "libs/dol-kv",
    "libs/dol-objects",
    "libs/dol-spreadsheet",
    "libs/dol-migration",
    "libs/dol-config",
    # Refactored stack (arena-based expr, lean IR, new builders)
    "libs/dol-expr",
    "libs/dol-ir",
    "libs/dol-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Collections
smallvec = { version = "1", features = ["union", "serde"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml_crate = { package = "toml", version = "1" }

# Async runtime (dev/test only)
tokio = { version = "1", features = ["rt", "macros"] }

# Internal crates
dol-types = { path = "libs/dol-types" }
dol-core = { path = "libs/dol-core" }
dol-entity = { path = "libs/dol-entity" }
dol-query = { path = "libs/dol-query" }
dol-sql = { path = "libs/dol-sql" }
dol-kv = { path = "libs/dol-kv" }
dol-objects = { path = "libs/dol-objects" }
dol-spreadsheet = { path = "libs/dol-spreadsheet" }
dol-migration = { path = "libs/dol-migration" }
dol-config = { path = "libs/dol-config" }
# Internal refactored crates
dol-expr            = { path = "libs/dol-expr" }
dol-ir              = { path = "libs/dol-ir" }
dol-builder         = { path = "libs/dol-builder" }
