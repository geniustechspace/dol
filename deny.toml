# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# Controls which crates are checked for unmaintained status (cargo-deny >= 0.16)
# Valid values: "all", "workspace", "transitive", "none"
unmaintained = "none"
# The lint level for crates that have been yanked from their source registry
yanked = "warn"
# Advisories to ignore (cannot be fixed without major dependency bumps)
ignore = []

[licenses]
# List of explicitly allowed licenses
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSL-1.0",
  "Unlicense",
  # Common transitive dependency licenses
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
]
# The confidence threshold for detecting a license from license text.
# [possible values: any floating point number from 0 to 1]
confidence-threshold = 0.8

# Workspace crates are private and not published to any registry;
# skip license checks for them.
[licenses.private]
ignore = true

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating a dotgraph for crates
highlight = "all"
# List of crates to deny
deny = []
# Certain crates/versions that will be skipped when doing duplicate detection
skip = []
# Similarly to `skip` allows you to skip certain crates during duplicate
# detection. Unlike skip, it also includes the entire tree of transitive
# dependencies starting at the specified crate.
skip-tree = []

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is
# not in the allow list is encountered
unknown-git = "warn"
# List of registries that are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of git repositories allowed
allow-git = []
