[package]
name = "dol-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL — streaming, time-series, and IoT/telemetry IR extensions."
readme = "README.md"

[dependencies]
dol-types  = { workspace = true }
dol-expr   = { workspace = true }
dol-schema = { workspace = true }
dol-ir     = { workspace = true }
smallvec   = { workspace = true }
serde      = { workspace = true, optional = true }

[features]
default = []
serde   = [
    "dep:serde",
    "dol-types/serde",
    "dol-expr/serde",
    "dol-schema/serde",
    "dol-ir/serde",
    "smallvec/serde",
]
