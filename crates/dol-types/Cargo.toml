[package]
name = "dol-types"
version.workspace = true
edition.workspace = true
publish = false
description = "DOL type system — DataType, Value, Literal, and all primitive types."

[dependencies]
serde = { workspace = true, optional = true }

[features]
# `serde` is on by default: this is a leaf primitive crate, the cost is
# negligible, and downstream consumers almost always want round-tripping.
# Embedded users can opt out with `default-features = false`.
default = ["serde"]
serde = ["dep:serde"]
