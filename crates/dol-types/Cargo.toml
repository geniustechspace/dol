[package]
name = "dol-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL type system — DataType, Value, Literal, and all primitive types."
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/geniustechspace/dol"
keywords = ["dol", "database", "schema", "types", "no-std"]
categories = ["database", "data-structures", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, optional = true }

[features]
# `serde` and `std` are on by default. The crate is `no_std + alloc`-clean
# when both are disabled, suitable for embedded targets that cannot link
# `std`. Embedded users opt out with `default-features = false`.
default = ["std", "serde"]
serde = ["dep:serde"]
# Enables the wall-clock factory helpers (`datetime::today`, `datetime::now`,
# `datetime::now_tz`) that require `std::time::SystemTime`. The
# `core::error::Error` impl on `TypeError` is always available
# (stable since Rust 1.81).
std = []

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1"
