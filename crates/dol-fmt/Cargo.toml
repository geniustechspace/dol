[package]
name = "dol-fmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DOL — canonical pretty-printer for IR programs."

[dependencies]
dol-ir     = { workspace = true }
dol-schema = { workspace = true }
dol-types  = { workspace = true }
dol-expr   = { workspace = true }

[features]
default = []
serde   = [
    "dol-ir/serde",
    "dol-schema/serde",
    "dol-types/serde",
    "dol-expr/serde",
]
