# DOL SQL Backend Configuration Example (TOML)
#
# This file demonstrates how to configure a DOL SQL backend in a TOML config.
# DOL supports multiple storage engines: SQL databases, key-value stores,
# and object storage. This example focuses on SQL backends with enterprise
# multi-instance support.
#
# Usage in Rust:
#   use dol::config::SqlConfig;
#   let sql_config: SqlConfig = toml::from_str(config)?;
#
#   // Or load the full DolConfig with all backends:
#   use dol::DolConfig;
#   let cfg = DolConfig::from_toml_str(config)?;
#
#   // Resolve the dialect for SQL rendering:
#   let dialect = sql_config.dialect.resolve();
#   let sql = model.get().all_columns().where_eq("id").to_sql(Some(&dialect));

# --- SQL dialect ---
# Built-in presets: "postgresql", "mysql", "mariadb", "sqlite", "mssql",
#                   "oracle", "cockroachdb"
# Aliases: "postgres", "pg", "sqlserver", "crdb"
# The default dialect when none is specified is "sqlite".
dialect = "sqlite"

# --- Primary (read-write) instance ---
[primary]
url = "sqlite://data/app.db"

[primary.pool]
max_connections = 5
min_connections = 1
acquire_timeout_secs = 30
idle_timeout_secs = 600
max_lifetime_secs = 1800

# --- For PostgreSQL ---
# [primary]
# url = "postgres://user:pass@localhost:5432/mydb"
#
# [primary.pool]
# max_connections = 20
# min_connections = 5
#
# [primary.tls]
# enabled = true
# ca_cert_path = "/etc/ssl/certs/rds-combined-ca-bundle.pem"
# accept_invalid_certs = false

# --- For MySQL ---
# [primary]
# url = "mysql://user:pass@localhost:3306/mydb"
#
# [primary.pool]
# max_connections = 20
# min_connections = 5

# --- Read replicas (optional) ---
# [[replicas]]
# name = "replica-east"
# url = "postgres://user:pass@replica-east:5432/mydb"
#
# [replicas.pool]
# max_connections = 30
#
# [[replicas]]
# name = "replica-west"
# url = "postgres://user:pass@replica-west:5432/mydb"

# --- Named instances for special workloads (optional) ---
# [instances.analytics]
# url = "postgres://analytics:pass@analytics-host/analytics_db"
#
# [instances.analytics.pool]
# max_connections = 50

# --- Migration settings ---
[migrations]
auto_run = true
directory = "migrations"

# --- Query logging ---
[logging]
log_queries = false
log_slow_queries = true
slow_query_threshold_ms = 100
